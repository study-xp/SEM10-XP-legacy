name: Build legacy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Vite source entry
        run: |
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
              <title>SEM 10-XP</title>
              <meta name="description" content="Semester 10 study tracker, planner, Pomodoro timer and exam countdowns — Windows XP themed. By Amro Adel." />
              <meta name="theme-color" content="#0a46c6" />
              <meta name="apple-mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
              <meta name="apple-mobile-web-app-title" content="SEM 10-XP" />
              <link rel="apple-touch-icon" href="/SEM10-XP-legacy/icons/apple-touch-icon.png" />
              <link rel="icon" type="image/png" sizes="32x32" href="/SEM10-XP-legacy/icons/favicon-32.png" />
              <link rel="icon" type="image/png" sizes="16x16" href="/SEM10-XP-legacy/icons/favicon-16.png" />
              <style>html,body,#root{height:100%;margin:0;background:#3f7ee8}</style>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

      - name: Build
        run: npm run build

      - name: Publish build to repository root
        run: |
          cp -R dist/. .
          rm -rf dist

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: deploy built legacy site"
            git push
          fi
